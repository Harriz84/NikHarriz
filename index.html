<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082746">
  <title>Apps van Harriz84</title>
  <style>
    :root{--navy:#082746;--blue:#176c89;--bg:#edf2f4;--paper:#fff;--muted:#667781}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#082746,#176c89);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff;min-height:100vh;padding:calc(30px + env(safe-area-inset-top)) 18px 40px}
    main{max-width:720px;margin:auto}h1{font-size:clamp(38px,10vw,62px);line-height:.98;margin:0 0 10px}p{opacity:.88}.grid{display:grid;gap:14px;margin-top:26px}.card{display:block;background:var(--paper);color:var(--navy);text-decoration:none;border-radius:22px;padding:20px;box-shadow:0 18px 45px #00162c55}.card strong{display:block;font-size:23px}.card span{display:block;color:var(--muted);margin-top:5px}.primary{border:3px solid #ffcd55}.icon{font-size:34px;margin-bottom:7px}
  </style>
</head>
<body>
<main>
  <h1>Mijn apps</h1>
  <p>Kies een app. Berlijn 2026 is geschikt om via Safari op het iPhone-beginscherm te zetten.</p>
  <div class="grid">
    <a class="card primary" href="./berlijn-2026/"><div class="icon">🗺️</div><strong>Berlijn 2026 Reisapp</strong><span>Dagplanning, routes, locaties en reistijden</span></a>
    <a class="card" href="./levenskompas/"><div class="icon">🧭</div><strong>Levenskompas</strong><span>Persoonlijke protocollen en handvatten</span></a>
    <a class="card" href="./gezinsuitjes/"><div class="icon">✨</div><strong>Gezinsuitjes rond Oeffelt</strong><span>Kindvriendelijke uitstapjes in de regio</span></a>
  </div>
</main>
</body>
</html>
