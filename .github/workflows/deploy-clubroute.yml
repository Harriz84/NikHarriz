name: Publish websites

on:
  push:
    branches: ["main"]
    paths:
      - "clubroute/**"
      - "index.html"
      - ".github/workflows/deploy-clubroute.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble public website
        run: |
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          cp -R clubroute public/clubroute
          cp -R clubroute/gezinsuitjes public/gezinsuitjes
          touch public/.nojekyll

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
