name: Deploy public apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "berlijn-2026/**"
      - "levenskompas/**"
      - ".github/workflows/public-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build public site
        run: |
          mkdir -p _site
          cp -R berlijn-2026 _site/
          if [ -d levenskompas ]; then cp -R levenskompas _site/; fi
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial;background:#edf2f4;color:#082746;padding:30px}main{max-width:700px;margin:auto}a{display:block;background:white;padding:20px;margin:12px 0;border-radius:16px;text-decoration:none;color:#082746;font-size:22px;font-weight:800;box-shadow:0 8px 24px #08274618}</style><main><h1>Apps van Harriz84</h1><a href="./berlijn-2026/">Berlijn 2026 Reisapp</a><a href="./levenskompas/">Levenskompas</a></main></html>
          EOF
          touch _site/.nojekyll
      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment result
        if: always()
        run: |
          mkdir -p .github
          {
            printf 'status=%s\n' "${{ job.status }}"
            printf 'url=%s\n' "${{ steps.deployment.outputs.page_url }}"
            printf 'run=%s\n' "${{ github.run_id }}"
          } > .github/pages-deployment-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-deployment-status.txt
          git diff --cached --quiet || git commit -m "Record Pages deployment status"
          git push
