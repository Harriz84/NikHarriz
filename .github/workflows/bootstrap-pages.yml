name: Activate and publish GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "clubroute/**"
      - ".github/workflows/bootstrap-pages.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

env:
  SITE_PATH: clubroute

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'Publish GitHub Pages now'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or activate Pages site through API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          echo "Pages activation request completed (an existing site may return an expected error)."
          exit 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_PATH }}

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report result in trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ GitHub Pages is gepubliceerd: ${PAGE_URL}gezinsuitjes/"
          else
            gh issue comment "$ISSUE_NUMBER" --body "❌ De Pages-publicatie is niet voltooid. Controleer de workflow-run **Activate and publish GitHub Pages** voor de exacte foutmelding. Uitkomst: ${DEPLOY_OUTCOME}."
          fi
