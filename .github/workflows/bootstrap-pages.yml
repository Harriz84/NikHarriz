name: Activate and publish GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "clubroute/**"
      - ".github/workflows/bootstrap-pages.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

env:
  SITE_PATH: clubroute

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Publish GitHub Pages')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Create or activate Pages site through API
        id: activate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RESPONSE=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow 2>&1)
          CODE=$?
          {
            echo 'response<<EOF'
            echo "$RESPONSE" | head -c 1500
            echo
            echo EOF
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          exit $CODE

      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload complete website
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_PATH }}

      - name: Deploy website
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report detailed result in trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTIVATE_OUTCOME: ${{ steps.activate.outcome }}
          ACTIVATE_CODE: ${{ steps.activate.outputs.code }}
          ACTIVATE_RESPONSE: ${{ steps.activate.outputs.response }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          BODY=$(cat <<EOF
          **Automatische Pages-publicatie**

          - API-activering: ${ACTIVATE_OUTCOME} (code ${ACTIVATE_CODE})
          - Pages-configuratie: ${CONFIGURE_OUTCOME}
          - Website-upload: ${UPLOAD_OUTCOME}
          - Publicatie: ${DEPLOY_OUTCOME}
          - Pagina-URL: ${PAGE_URL:-niet beschikbaar}

          API-antwoord:
          \`\`\`
          ${ACTIVATE_RESPONSE}
          \`\`\`
          EOF
          )
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
